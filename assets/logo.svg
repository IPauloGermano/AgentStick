<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- OpenCode Portable Official Logo - Transparent Vector Icon -->
  <!-- SPDX-License-Identifier: MIT -->
  <defs>
    <!-- USB Metallic Gradient -->
    <linearGradient id="usbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a324b" />
      <stop offset="50%" stop-color="#1e2235" />
      <stop offset="100%" stop-color="#141824" />
    </linearGradient>

    <!-- Connector Metallic Gradient -->
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#7f00ff" />
    </linearGradient>

    <!-- Neon Cyan Gradient -->
    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#00c6ff" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Glow Behind Body -->
  <rect x="135" y="135" width="242" height="302" rx="46" fill="#00f2fe" opacity="0.18" filter="url(#neonGlow)" />

  <!-- USB Metal Connector Plug (Top) -->
  <rect x="206" y="68" width="100" height="78" rx="10" fill="url(#metalGrad)" stroke="#475569" stroke-width="2" />
  <rect x="225" y="88" width="22" height="28" rx="3" fill="#0f172a" opacity="0.9" />
  <rect x="265" y="88" width="22" height="28" rx="3" fill="#0f172a" opacity="0.9" />
  <rect x="229" y="93" width="14" height="16" rx="2" fill="#f59e0b" opacity="0.95" />
  <rect x="269" y="93" width="14" height="16" rx="2" fill="#f59e0b" opacity="0.95" />

  <!-- USB Main Body (Center & Bottom) -->
  <rect x="140" y="140" width="232" height="292" rx="42" fill="url(#usbGrad)" stroke="url(#borderGrad)" stroke-width="4" />
  <rect x="143" y="143" width="226" height="286" rx="39" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.1" />

  <!-- Activity Indicator LED -->
  <circle cx="256" cy="170" r="5" fill="#00f2fe" filter="url(#neonGlow)" />
  <circle cx="256" cy="170" r="9" fill="#00f2fe" opacity="0.25" />

  <!-- OLED Terminal Display Screen -->
  <rect x="164" y="195" width="184" height="184" rx="24" fill="#070a12" stroke="#00f2fe" stroke-width="2" stroke-opacity="0.5" />

  <!-- Terminal Prompt Symbol ">" -->
  <polyline points="202,245 246,287 202,329" fill="none" stroke="url(#cyanNeon)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)" />

  <!-- Neon Cursor "_" -->
  <line x1="268" y1="329" x2="310" y2="329" stroke="#a855f7" stroke-width="18" stroke-linecap="round" filter="url(#neonGlow)" />

  <!-- Bottom Lanyard Slot -->
  <rect x="232" y="405" width="48" height="10" rx="5" fill="#070a12" stroke="#ffffff" stroke-width="1" stroke-opacity="0.2" />
</svg>
